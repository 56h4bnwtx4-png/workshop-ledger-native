name: Build unsigned arm64 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "WorkshopLedger/**"
      - "tools/inject_model_catalog.py"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

env:
  APP_VERSION: "1.5.1"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject local model catalog
        env:
          MODEL_CATALOG_B64: ${{ secrets.MODEL_CATALOG_B64 }}
        run: python3 tools/inject_model_catalog.py

      - name: Verify local model catalog source
        shell: bash
        env:
          MODEL_CATALOG_B64: ${{ secrets.MODEL_CATALOG_B64 }}
        run: |
          set -euo pipefail
          test -f WorkshopLedger/Resources/model-catalog.txt
          MODEL_COUNT=$(grep -Ev '^[[:space:]]*(#|$)' WorkshopLedger/Resources/model-catalog.txt | wc -l | tr -d ' ')
          echo "model_catalog_entries=$MODEL_COUNT"
          if [ -n "${MODEL_CATALOG_B64:-}" ]; then
            test "$MODEL_COUNT" -gt 0
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project WorkshopLedger.xcodeproj \
            -scheme WorkshopLedger \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build | tee build.log

      - name: Verify and package IPA
        shell: bash
        env:
          MODEL_CATALOG_B64: ${{ secrets.MODEL_CATALOG_B64 }}
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/WorkshopLedger.app"
          IPA_NAME="WorkshopLedger-v${APP_VERSION}-iOS-arm64-unsigned.ipa"
          test -d "$APP_PATH"
          test -f "$APP_PATH/WorkshopLedger"
          test -f "$APP_PATH/model-catalog.txt"
          MODEL_COUNT=$(grep -Ev '^[[:space:]]*(#|$)' "$APP_PATH/model-catalog.txt" | wc -l | tr -d ' ')
          echo "bundled_model_catalog_entries=$MODEL_COUNT"
          if [ -n "${MODEL_CATALOG_B64:-}" ]; then
            test "$MODEL_COUNT" -gt 0
          fi
          lipo -info "$APP_PATH/WorkshopLedger"
          lipo -info "$APP_PATH/WorkshopLedger" | grep -q arm64
          plutil -p "$APP_PATH/Info.plist"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_NAME" Payload
          unzip -l "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopLedger-v${{ env.APP_VERSION }}-iOS-arm64-unsigned
          path: |
            WorkshopLedger-v${{ env.APP_VERSION }}-iOS-arm64-unsigned.ipa
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          if-no-files-found: ignore
